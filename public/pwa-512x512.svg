<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="180" fill="#18181b" stroke="#27272a" stroke-width="6"/>
  
  <!-- Sound Wave / Lyric Lines -->
  <rect x="130" y="160" width="160" height="18" rx="9" fill="#52525b" />
  <rect x="130" y="200" width="220" height="20" rx="10" fill="url(#accentGrad)" filter="url(#glow)" />
  <rect x="130" y="240" width="140" height="18" rx="9" fill="#52525b" />
  <rect x="130" y="280" width="180" height="18" rx="9" fill="#3f3f46" />

  <!-- Synchronized Note Symbol -->
  <g transform="translate(320, 260) scale(1.2)">
    <circle cx="28" cy="70" r="22" fill="url(#accentGrad)" />
    <circle cx="78" cy="55" r="22" fill="url(#accentGrad)" />
    <path d="M48 70 V15 L100 0 V55" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
